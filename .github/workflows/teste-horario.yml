name: Teste de horario (temporario)

on:
  schedule:
    - cron: "23 14 * * *"
    - cron: "38 14 * * *"
    - cron: "30 11 * * *"
    - cron: "50 11 * * *"
  workflow_dispatch: {}

jobs:
  registrar:
    runs-on: ubuntu-latest
    steps:
      - name: Registrar horario
        run: |
          echo "evento: ${{ github.event_name }}"
          echo "cron que disparou: ${{ github.event.schedule }}"
          echo "inicio (UTC): $(date -u)"
