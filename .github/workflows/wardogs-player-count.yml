name: WARDOGS - Jogadores online

on:
  schedule:
    - cron: "5 22 * * *" # 19h05 no horario de Brasilia (UTC-3), todos os dias
    - cron: "20 17 * * 6,0" # 14h20 no horario de Brasilia (UTC-3), sabado e domingo
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/post-player-count.js
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      - name: Salvar id da ultima mensagem
        run: |
          git config user.name "wardogs-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/player-count-state.json
          git diff --cached --quiet || git commit -m "chore: atualiza id da ultima mensagem de contagem"
          git push
