name: WARDOGS - Jogadores online

on:
  schedule:
    - cron: "5 22 * * *" # 19h05 no horario de Brasilia (UTC-3) — alguns minutos apos a hora cheia pra evitar atraso/descarte do GitHub
  workflow_dispatch: {}

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/post-player-count.js
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
