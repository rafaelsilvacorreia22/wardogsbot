name: WARDOGS - Noticias oficiais / patch notes

on:
  schedule:
    - cron: "*/30 * * * *" # confere a cada 30 minutos
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/post-news.js
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      - name: Salvar estado das noticias ja postadas
        run: |
          git config user.name "wardogs-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/state.json
          git diff --cached --quiet || git commit -m "chore: atualiza noticias ja postadas"
          git push
